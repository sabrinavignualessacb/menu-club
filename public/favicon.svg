<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="50%" stop-color="#001489" />
      <stop offset="100%" stop-color="#071b4f" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#001489" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Circle with Gold Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <circle cx="256" cy="256" r="240" fill="url(#innerGlow)" />
  
  <!-- Outer Gold Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
  <!-- Inner Fine Gold Accent Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Chef Hat Crest Icon -->
  <g filter="url(#dropShadow)">
    <!-- Chef Hat Base Band -->
    <rect x="180" y="306" width="152" height="42" rx="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
    <!-- Band Stitch Lines -->
    <line x1="190" y1="327" x2="322" y2="327" stroke="#78350f" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6" />

    <!-- Chef Hat Puffs / Clouds -->
    <!-- Center High Puff -->
    <path
      d="M256,128 C288,128 314,152 316,184 C338,188 354,208 352,232 C350,252 338,268 322,274 L322,306 L190,306 L190,274 C174,268 162,252 160,232 C158,208 174,188 196,184 C198,152 224,128 256,128 Z"
      fill="#ffffff"
      stroke="url(#goldGrad)"
      stroke-width="10"
      stroke-linejoin="round"
    />

    <!-- Hat Pleat Folds (Depth) -->
    <path d="M226,178 Q222,240 220,304" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
    <path d="M256,162 Q256,236 256,304" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
    <path d="M286,178 Q290,240 292,304" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />

    <!-- Crossed Gourmet Utensils below hat -->
    <!-- Fork -->
    <g transform="rotate(-35 256 395)">
      <!-- Handle -->
      <path d="M253,365 L253,440 C253,445 259,445 259,440 L259,365 Z" fill="url(#goldGrad)" />
      <!-- Prongs Base -->
      <path d="M246,365 C246,355 266,355 266,365 Z" fill="url(#goldGrad)" />
      <!-- Prongs -->
      <line x1="248" y1="340" x2="248" y2="358" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
      <line x1="253" y1="340" x2="253" y2="358" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
      <line x1="259" y1="340" x2="259" y2="358" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
      <line x1="264" y1="340" x2="264" y2="358" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Spoon / Knife -->
    <g transform="rotate(35 256 395)">
      <!-- Handle -->
      <path d="M253,365 L253,440 C253,445 259,445 259,440 L259,365 Z" fill="url(#goldGrad)" />
      <!-- Spoon Bowl / Knife Blade -->
      <path d="M247,358 C247,338 265,338 265,358 C265,368 247,368 247,358 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Small Star Accent -->
    <polygon points="256,364 260,374 270,374 262,380 265,390 256,384 247,390 250,380 242,374 252,374" fill="#fef08a" />
  </g>
</svg>
